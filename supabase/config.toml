# Supabase CLI project config.
#
# Only the bits this repo actually relies on are pinned here; everything else
# stays on CLI defaults so the file does not drift into a second source of
# truth for the hosted project.

project_id = "duigao"

[functions.share-preview]
# Social crawlers (LINE, Facebook, Messenger, X) fetch the card with no
# Authorization header, so JWT verification must be off for this one function.
# It is safe because the function is read-only, reads through a single
# anon-granted RPC that exposes no room data, and never receives the invite
# token (it lives in the URL fragment, which no browser sends to a server).
verify_jwt = false

[functions.canva-bridge]
# OAuth callback 是 Canva 授權後的瀏覽器 redirect（GET、無 Authorization
# header）：平台的 JWT 閘必須關掉，否則 callback 永遠到不了函式（Grok 05
# F1）。安全性由函式內部承擔：POST 動作全部自驗 JWT；callback 只消費
# 一次性 state（撞不對就 400），token 落 service-role 專用表（0020）。
verify_jwt = false

[functions.room-ai-context]
# The function checks the caller's Supabase JWT and RLS-visible membership
# before returning a bounded, metadata-only context projection.
verify_jwt = true

[functions.asset-analysis]
# Queueing and re-analysis are owner/editor operations.  The function uses the
# caller's JWT, never a service-role key, and only creates short-lived provider
# URLs after the asset's external_ai_allowed policy passes.
verify_jwt = true
