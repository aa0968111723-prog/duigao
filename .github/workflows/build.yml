name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # `npm run build` starts with the deployment gate (check-cloud-env
      # --strict), which fails without the Supabase env. That gate exists to
      # stop a BROKEN DEPLOYMENT — a build that could only ever hand out
      # host-must-stay-online links — and the deployment platforms (Zeabur /
      # Vercel) still run it. In CI without those secrets it fails on line one
      # every time, so typecheck and build never run at all and CI has not
      # reported a real problem since it started failing.
      #
      # With the secrets present this is unchanged. Without them, CI still does
      # the part it can honestly do: tsc --noEmit && vite build.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            npm run build
          else
            echo "Cloud env secrets are not configured for this repository."
            echo "Running the typecheck and build without the deployment gate."
            npm run build:local
          fi

  # The security rules of this app are RLS policies, not application code. They
  # are only ever exercised by scripts/e2e/migrations.mjs against a real
  # PostgreSQL — so until this job existed, a migration that let a link visitor
  # delete other people's versions could reach main with CI green.
  #
  # REQUIRE_PG=1 turns the script's developer-friendly "no database, never
  # mind" into a hard failure: a gate that skips itself is not a gate.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
      - run: npm install
      - name: RLS / capability rules
        env:
          REQUIRE_PG: "1"
          PG_BIN: /usr/lib/postgresql/16/bin
        run: npm run test:migrations

  # The browser suites drive a real production bundle against a fake Supabase,
  # so they need Chromium but no cloud secrets.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # Playwright is a devDependency for the checked-in browser suites. The
      # browser binary is still installed explicitly here, so npm install does
      # not download Chromium for every local install.
      - name: Install Playwright
        run: |
          npx playwright install --with-deps chromium
      - run: npm run test:multi-branch
      - run: npm run test:edge-cors
      - run: npm run test:asset-intelligence
      - run: npm run test:collaboration
      - run: npm run test:multi-branch-e2e
      - run: npm run test:collaboration-e2e
      - run: npm run test:review-viewer
      - run: npm run test:video
      - run: npm run test:share-e2e
      - run: npm run test:share-preview
