<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&family=Outfit:wght@600;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #0f0e0c; font-family: "Noto Sans TC", "PingFang TC", "Hiragino Sans CJK TC", system-ui, sans-serif; }
    a { color: #E4841D; text-decoration: none; }
    a:hover { color: #E99E13; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0f0e0c; color: #f4efe6; display: flex; flex-direction: column; overflow: hidden; padding-top: 44px;">

  <div style="flex: none; display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 8px 0 10px;">
    <div style="flex: none; width: 32px; height: 32px; display: grid; place-items: center;">
      <div style="width: 12px; height: 12px; border-radius: 50%; background: #C83624; box-shadow: 0 0 0 4px rgba(196, 92, 74, 0.16);"></div>
    </div>
    <div style="flex: 1; min-width: 0; padding: 8px 6px; font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">春季說明會主視覺</div>
    <div style="flex: none; width: 8px; height: 8px; border-radius: 50%; background: #6faf74;"></div>
    <div style="flex: none; min-height: 36px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; background: #221e1a; color: #f4efe6; font-size: 14px;">分享</div>
  </div>

  <div style="flex: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 10px; overflow: hidden;">
    <div style="flex: none; min-height: 34px; display: inline-flex; align-items: center; padding: 0 14px; border: 1px solid #2a2622; border-radius: 999px; color: #7d7469; font-size: 14px;">初稿</div>
    <div style="flex: none; min-height: 34px; display: inline-flex; align-items: center; padding: 0 14px; border: 1px solid #f4efe6; border-radius: 999px; background: #f4efe6; color: #17140f; font-size: 14px; font-weight: 500;">改一</div>
    <div style="flex: none; min-height: 34px; display: inline-flex; align-items: center; padding: 0 14px; border: 1px solid #2a2622; border-radius: 999px; color: #7d7469; font-size: 14px;">改二</div>
    <div style="flex: none; min-height: 34px; display: inline-flex; align-items: center; padding: 0 12px; border: 1px dashed #2a2622; border-radius: 999px; color: #7d7469; font-size: 14px;">＋</div>
  </div>

  <div style="flex: 1; min-height: 0; padding: 6px 8px 8px; display: flex;">
    <div style="position: relative; flex: 1; min-width: 0; border-radius: 14px; overflow: hidden; background: #0c0b09; display: grid; place-items: center;">

      <div style="position: relative; width: 100%; height: 100%; background: #F7F2EF; color: #241D1C; padding: 26px 24px; display: flex; flex-direction: column; justify-content: space-between;">

        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="font-family: 'Outfit', 'Noto Sans TC', system-ui, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: -0.3px;"><span style="color: #C83624;">A</span><span style="color: #E4841D;">i</span><span style="color: #8DB52E;">O</span><span style="color: #11978D;">S</span></div>
          <div style="font-size: 11px; letter-spacing: 2px; color: #8a7f7c;">2026 SPRING</div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 14px;">
          <div style="font-family: 'Noto Serif TC', 'Songti TC', serif; font-size: 46px; font-weight: 700; line-height: 1.16; letter-spacing: 1px; color: #C83624;">春季<br>說明會</div>
          <div style="display: flex; gap: 5px;">
            <div style="flex: 1; height: 7px; border-radius: 999px; background: #BC1A1F;"></div>
            <div style="flex: 1; height: 7px; border-radius: 999px; background: #D85E2A;"></div>
            <div style="flex: 1; height: 7px; border-radius: 999px; background: #E99E13;"></div>
            <div style="flex: 1; height: 7px; border-radius: 999px; background: #8DB52E;"></div>
            <div style="flex: 1; height: 7px; border-radius: 999px; background: #109958;"></div>
            <div style="flex: 1; height: 7px; border-radius: 999px; background: #11978D;"></div>
          </div>
          <div style="font-size: 15px; line-height: 1.8; color: #4a403e;">給第一次接觸的人，<br>一個下午把事情講清楚。</div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="font-size: 13px; color: #8a7f7c;">3 / 29 SAT · 14:00</div>
          <div style="font-size: 13px; color: #8a7f7c;">台北 · 松菸五號倉庫</div>
          <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
            <div style="padding: 9px 16px; border-radius: 999px; background: #109958; color: #fff; font-size: 13px; font-weight: 600;">免費入場</div>
            <div style="width: 52px; height: 52px; border-radius: 8px; background: #241D1C;"></div>
          </div>
        </div>

      </div>

      <div style="position: absolute; left: 24%; top: 40%; transform: translate(-50%, -50%); height: 28px; min-width: 28px; display: grid; grid-auto-flow: column; align-items: center; border: 2px solid rgba(255, 255, 255, 0.92); border-radius: 999px; background: #C83624; color: #fff; font-size: 12px;">
        <div style="display: grid; place-items: center; width: 24px; line-height: 1;">1</div>
      </div>

      <div style="position: absolute; left: 26%; top: 71%; transform: translate(-14px, -50%); height: 28px; min-width: 28px; display: grid; grid-auto-flow: column; align-items: center; gap: 6px; border: 2px solid rgba(255, 255, 255, 0.92); border-radius: 999px; background: #C83624; color: #fff; font-size: 12px; box-shadow: 0 0 0 4px rgba(196, 92, 74, 0.16), 0 3px 10px rgba(0, 0, 0, 0.45); z-index: 5;">
        <div style="display: grid; place-items: center; width: 24px; line-height: 1;">2</div>
        <div style="padding-right: 10px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42vw;">日期的字太小</div>
      </div>

      <div style="position: absolute; left: 82%; top: 88%; transform: translate(-50%, -50%); height: 28px; min-width: 28px; display: grid; grid-auto-flow: column; align-items: center; border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 999px; background: #3b3630; color: #b6ada0; font-size: 12px;">
        <div style="display: grid; place-items: center; width: 24px; line-height: 1;">3</div>
      </div>

    </div>
  </div>

  <div style="flex: none; display: flex; flex-direction: column; overflow: hidden; background: rgba(27, 24, 21, 0.98); border-top: 1px solid rgba(255, 255, 255, 0.07); border-radius: 20px 20px 0 0; box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.34);">
    <div style="flex: none; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;">
      <div style="width: 34px; height: 4px; border-radius: 999px; background: #4b443c;"></div>
      <div style="font-size: 13px; color: #b6ada0;">待修改 4<em style="margin: 0 6px; font-style: normal; color: #7d7469;">·</em>已完成 2</div>
    </div>
  </div>

  <div style="flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; height: 58px; padding: 4px 6px; background: rgba(20, 18, 16, 0.98); border-top: 1px solid rgba(255, 255, 255, 0.07);">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 14px; background: rgba(196, 92, 74, 0.16); color: #f4efe6; font-size: 11px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.6"></circle></svg>
      <span>看</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 14px; color: #d98675; font-size: 11px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s6.5-5.4 6.5-10.2A6.5 6.5 0 0 0 5.5 10.8C5.5 15.6 12 21 12 21Z"></path><circle cx="12" cy="10.6" r="2.4"></circle></svg>
      <span>修改</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 14px; color: #7d7469; font-size: 11px;">
      <div style="position: relative; display: grid; place-items: center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2.2-3.1A8 8 0 1 1 21 12Z"></path></svg>
        <span style="position: absolute; top: -3px; right: -9px; min-width: 16px; height: 16px; padding: 0 4px; display: grid; place-items: center; border-radius: 999px; background: #C83624; color: #fff; font-size: 10px; font-weight: 600;">4</span>
      </div>
      <span>討論</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 14px; color: #7d7469; font-size: 11px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="12" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="18.5" cy="12" r="1.4"></circle></svg>
      <span>更多</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
