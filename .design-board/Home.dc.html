<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&family=Outfit:wght@600;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #0f0e0c; font-family: "Noto Sans TC", "PingFang TC", "Hiragino Sans CJK TC", system-ui, sans-serif; }
    a { color: #E4841D; text-decoration: none; }
    a:hover { color: #E99E13; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0f0e0c; color: #f4efe6; padding: 52px 16px 28px; display: flex; flex-direction: column; gap: 20px; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
    <div style="font-family: 'Outfit', 'Noto Sans TC', system-ui, sans-serif; font-size: 19px; font-weight: 700; letter-spacing: -0.4px;"><span style="color: #C83624;">A</span><span style="color: #E4841D;">i</span><span style="color: #8DB52E;">O</span><span style="color: #11978D;">S</span></div>
    <div style="min-height: 36px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; background: #221e1a; color: #b6ada0; font-size: 13px;">阿哲</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="font-family: 'Noto Serif TC', 'Songti TC', serif; font-size: 25px; font-weight: 600; letter-spacing: 2px;">對稿</div>
    <div style="font-size: 15px; line-height: 1.7; color: #b6ada0;">把做好的文宣變成一條連結，<br>大家不改原稿，只指出哪裡要調整。</div>
  </div>

  <div style="display: grid; gap: 12px;">

    <div style="min-height: 76px; display: flex; align-items: center; gap: 14px; padding: 18px; border: 1px solid #2a2622; border-radius: 20px; background: #1b1815;">
      <div style="flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; background: rgba(228, 132, 29, 0.14); color: #E4841D;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><path d="m3 16 4.5-4.2 3.6 3.3 3.4-3.1L21 16.6"></path><circle cx="8.6" cy="8.8" r="1.3"></circle></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <b style="font-size: 16px; color: #f4efe6;">文宣對稿</b>
        <small style="font-size: 12.5px; line-height: 1.5; color: #b6ada0;">海報、DM、社群圖</small>
      </div>
    </div>

    <div style="min-height: 76px; display: flex; align-items: center; gap: 14px; padding: 18px; border: 1px solid #2a2622; border-radius: 20px; background: #1b1815;">
      <div style="flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; background: rgba(17, 151, 141, 0.15); color: #11978D;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="14" height="14" rx="2.5"></rect><path d="m16.5 10.5 5-2.6v8.2l-5-2.6"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <b style="font-size: 16px; color: #f4efe6;">影片對稿</b>
        <small style="font-size: 12.5px; line-height: 1.5; color: #b6ada0;">某一刻、某一段留意見</small>
      </div>
    </div>

    <div style="min-height: 76px; display: flex; align-items: center; gap: 14px; padding: 18px; border: 1px solid rgba(196, 92, 74, 0.45); border-radius: 20px; background: rgba(196, 92, 74, 0.16);">
      <div style="flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; background: rgba(255, 255, 255, 0.06); color: #C83624;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="7.5" height="7.5" rx="2"></rect><rect x="13.5" y="3.5" width="7.5" height="7.5" rx="2"></rect><rect x="3" y="13" width="7.5" height="7.5" rx="2"></rect><rect x="13.5" y="13" width="7.5" height="7.5" rx="2"></rect></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <b style="font-size: 16px; color: #f4efe6;">專案房</b>
        <small style="font-size: 12.5px; line-height: 1.5; color: #b6ada0;">一個活動的文宣、影片、企劃放一起</small>
      </div>
    </div>

  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="font-size: 13px; color: #7d7469; padding-left: 2px;">最近開過</div>

    <div style="min-height: 56px; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid #2a2622; border-radius: 14px; background: #1b1815;">
      <div style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"><span style="margin-right: 6px; opacity: 0.7;">▧</span>春季說明會主視覺</div>
      <div style="flex: none; font-size: 12px; color: #7d7469;">3 分鐘前</div>
    </div>

    <div style="min-height: 56px; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid #2a2622; border-radius: 14px; background: #1b1815;">
      <div style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"><span style="margin-right: 6px; opacity: 0.7;">▶</span>活動側錄 30 秒</div>
      <div style="flex: none; font-size: 12px; color: #7d7469;">昨天</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
